<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestor de Planos{% endblock %}</title>
    <style>
        :root {
            --bg: #f4f6f8;
            --card: #ffffff;
            --border: #dfe3e8;
            --text: #1f2933;
            --muted: #6b7280;
            --accent: #1e5eff;
            --ok: #1a9d5c;
            --warn: #c98a00;
            --bad: #c0362c;
            --info: #1c6fd1;
            --purple: #7c3aed;
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
        }
        header {
            background: #10233f;
            color: white;
            padding: 16px 24px;
        }
        header h1 { margin: 0; font-size: 20px; }
        header p { margin: 2px 0 0; color: #b9c6de; font-size: 13px; }
        main { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .tabla-scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            white-space: normal;
            word-break: break-word;
            vertical-align: top;
        }
        th { background: #eef1f5; color: var(--muted); font-weight: normal; white-space: nowrap; }
        tr:hover { background: #f8fafc; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            white-space: nowrap;
        }
        .badge-ok { background: var(--ok); }
        .badge-warn { background: var(--warn); }
        .badge-bad { background: var(--bad); }
        .badge-muted { background: var(--muted); }
        .badge-info { background: var(--info); }
        .badge-purple { background: var(--purple); }
        .filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
        .filtros label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
        .filtros input, .filtros select {
            padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
            max-width: 100%;
        }
        form label:not(.filtros label) { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; margin-top: 4px; }
        form input[type="text"]:not(.filtros input), form input[type="date"]:not(.filtros input) {
            padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
        }
        .filtros button, .btn {
            padding: 9px 18px; background: var(--accent); color: white; border: none;
            border-radius: 6px; cursor: pointer; font-size: 14px; text-decoration: none;
            display: inline-block;
        }
        .btn-secundario { background: var(--muted); }
        .muted { color: var(--muted); font-size: 13px; }
        .timeline { list-style: none; padding: 0; margin: 0; }
        .timeline li { border-left: 3px solid var(--accent); padding: 8px 16px; margin-bottom: 6px; word-break: break-word; }
        .tabs-proyecto { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .tabs-proyecto a {
            padding: 8px 16px; border-radius: 6px; background: #eef1f5; color: var(--text);
            font-size: 13px; font-weight: bold;
        }
        .tabs-proyecto a.activo { background: var(--accent); color: white; }

        @media (max-width: 640px) {
            main { padding: 0 10px; margin: 12px auto; }
            header { padding: 12px 14px; flex-direction: column; align-items: flex-start !important; gap: 8px; }
            table { font-size: 12px; }
            th, td { padding: 6px 8px; }
            form.filtros { flex-direction: column; align-items: stretch; }
            form.filtros input, form.filtros select { width: 100%; }
        }
    </style>
</head>
<body>
<header style="display:flex; justify-content:space-between; align-items:center;">
    <div>
        <h1>Gestor de Planos</h1>
        <p>{{ total_planos if total_planos is defined else "" }} planos cargados</p>
    </div>
    {% if rol %}
    <div style="text-align:right; font-size:13px;">
        <span style="color:#b9c6de">Rol: {{ rol }}</span><br>
        <a href="/logout" style="color:#8fb0ff">Cerrar sesión</a>
    </div>
    {% endif %}
</header>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
